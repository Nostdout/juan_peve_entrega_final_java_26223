# Nombre de la aplicación Spring Boot
spring.application.name=coffee-api

# Configuracion de MySQL
# Dirección de conexión a MySQL y nombre de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/coffeedb?useSSL=false&serverTimezone=UTC
# Usuario
spring.datasource.username=root
# Contraseña
spring.datasource.password=

# Configuracion de JPA / Hibernate
# Actualiza el esquema de la base de datos según las entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true
# Da formato legible a las consultas SQL
spring.jpa.properties.hibernate.format_sql=true
